<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>题目截图与解答 - 网页题目助手</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="results">
    <main>
      <header class="results-heading">
        <div>
          <h1>题目截图与解答</h1>
          <p id="result-status" class="status" role="status" aria-live="polite">正在加载本次截图…</p>
        </div>
        <div class="results-actions">
          <button id="open-settings" class="secondary-button" type="button">API 设置</button>
          <button id="cancel-questions" class="secondary-button cancel-button" type="button" hidden>取消处理</button>
          <button id="retry-answer" class="secondary-button" type="button" hidden>重试解答</button>
        </div>
      </header>
      <section id="questions-section" class="questions-section" hidden>
        <h2 id="questions-title">识别出的题目截图</h2>
        <p id="confirmation-hint" class="hint" hidden>检查每道题的裁切图，可拖动区域移动、拖动边缘或角点调整大小；也可删除题目，或在原长图上框选新增题目。只有点击“确认并逐题求解”后，最终选中的裁切图才会发送给解答模型。</p>
        <section id="crop-editor-panel" class="crop-editor-panel" hidden>
          <div class="crop-editor-heading">
            <div>
              <h3>在整页截图上编辑题目区域</h3>
              <p id="crop-editor-hint" class="hint">拖动题目框可移动，拖动边缘或角点可调整；触屏同样支持。用下方按钮开始框选新增区域。</p>
            </div>
            <button id="add-question-mode" class="secondary-button" type="button">框选新增题目</button>
          </div>
          <p id="crop-editor-mode" class="status" role="status" aria-live="polite" hidden></p>
          <div id="crop-editor-viewport" class="crop-editor-viewport">
            <div id="crop-editor-stage" class="crop-editor-stage">
              <img id="crop-editor-image" alt="用于编辑题目裁切框的整页截图">
              <div id="crop-editor-overlay" class="crop-editor-overlay" aria-label="题目截图裁切区域"></div>
            </div>
          </div>
        </section>
        <div id="questions-list"></div>
        <div class="button-row question-actions">
          <button id="recognize-again" class="secondary-button" type="button" hidden>重新识别</button>
          <button id="confirm-questions" class="primary-button" type="button" hidden>确认并逐题求解</button>
        </div>
      </section>
      <footer class="ai-disclaimer">解答由AI生成，请注意甄别。</footer>
    </main>
    <script src="result-store.js"></script>
    <script src="answer-renderer.js"></script>
    <script src="results.js"></script>
  </body>
</html>
